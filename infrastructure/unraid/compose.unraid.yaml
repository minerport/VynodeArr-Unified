services:
  vynodearr:
    image: ghcr.io/minerport/vynodearr:develop
    container_name: vynodearr
    restart: unless-stopped
    ports:
      - "4310:4310"
    volumes:
      - /mnt/user/appdata/vynodearr:/data
      - /mnt/user/appdata/vynodearr/secrets:/run/secrets:ro
    environment:
      VYNODEARR_DATA_MODE: engine
      VYNODEARR_DATA_DIR: /data
      VYNODEARR_SECURE_COOKIES: "false"
      VYNODEARR_MASTER_KEY_FILE: /run/secrets/master-key
      MOVIE_ENGINE_ENABLED: "true"
      MOVIE_ENGINE_HOST: movie-engine
      MOVIE_ENGINE_PORT: "7878"
      MOVIE_ENGINE_API_CREDENTIAL_FILE: /run/secrets/movie-api-key
      TV_ENGINE_ENABLED: "true"
      TV_ENGINE_HOST: tv-engine
      TV_ENGINE_PORT: "8989"
      TV_ENGINE_API_CREDENTIAL_FILE: /run/secrets/tv-api-key
      REQUEST_ENGINE_HOST: request-engine
      REQUEST_ENGINE_PORT: "5055"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  request-engine:
    build:
      context: https://github.com/minerport/VynodeSeerr.git#develop
    image: vynodearr-request-engine:review
    container_name: vynodearr-request-engine
    restart: unless-stopped
    init: true
    environment:
      PORT: "5055"
      CONFIG_DIRECTORY: /app/config
    volumes:
      - /mnt/user/appdata/vynodearr/requests:/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5055/api/v1/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
