name: Android companion
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  push:
    branches: [main, develop]
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-companion-debug-preview
          path: android-companion/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-companion-checks
          path: |
            android-companion/app/build/reports/
            android-companion/app/build/test-results/
          retention-days: 14
