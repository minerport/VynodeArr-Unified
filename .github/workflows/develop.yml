name: Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-container
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.unraid
          platforms: linux/amd64
          push: true
          build-args: |
            VYNODEARR_VERSION=2.0.34-develop.${{ github.run_number }}
          tags: |
            ghcr.io/minerport/vynodearr-unified:develop
            ghcr.io/minerport/vynodearr-unified:develop-${{ github.sha }}
