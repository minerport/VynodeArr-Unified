services:
  vynodearr:
    image: ghcr.io/minerport/vynodearr-unified:${VYNODEARR_VERSION:-2.0.2}
    container_name: vynodearr
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      TZ: ${TZ:-America/New_York}
      VYNODEARR_SECURE_COOKIES: "false"
      # Optional first-run bootstrap. You can configure or replace this later
      # under Service Settings > Discover in VynodeArr.
      TMDB_API_READ_TOKEN: ${TMDB_API_READ_TOKEN:-}
    volumes:
      - ./data:/config
      - ./movies:/movies
      - ./television:/tv
      - ./downloads:/downloads
